name: Prismica CI

on:
  push:
  pull_request:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: 'Prismica.sln'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 必须与后续 Build/Test 同为 Release：Directory.Build.props 在 Release 下为所有项目
      # 注入 RuntimeIdentifier=win-x64，restore 不带配置会漏掉该 RID 目标（NETSDK1047）。
      # 注意：dotnet restore 不识别 -c（会原样传给 MSBuild 报 MSB1001），用 -p:Configuration=Release。
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} -p:Configuration=Release

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test (Release)
        run: >-
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 7
